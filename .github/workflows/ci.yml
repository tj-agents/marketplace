name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-standards:
    name: python-standards
    uses: tj-agents/template/.github/workflows/python-standards.yml@7a06ba176a7245248fee3270842e0c4ed3030653

  verify:
    name: verify
    needs: python-standards
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Generated marketplaces and instruction pairs are current
        run: python -B generate.py --check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Sync the locked Python tooling environment
        run: uv sync --locked
      - name: Instruction pair tests
        run: uv run --locked pytest -q

  generic-scope-check:
    name: Generic scope check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational only: several generic repositories still mention Infonetica while
    # their cleanups land in parallel. Not in .github/merge-policy.json required_checks;
    # remove continue-on-error once check_generic_scope.py reports no violations.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Generic repositories name no specific profile
        run: python -B check_generic_scope.py
