name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: generate marketplaces from the authored roster
        run: python -B generate.py
      - name: generated marketplaces and instruction pairs are current
        run: python -B generate.py --check
      - name: install test runner
        run: python -m pip install pytest==9.1.1
      - name: instruction pair tests
        run: python -B -m pytest -q -o strict=true -W error

  regenerate:
    if: >-
      github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && !startsWith(github.event.head_commit.message, 'Regenerate packages for ')
    needs: verify
    runs-on: ubuntu-latest
    environment: update-pins
    concurrency:
      group: regenerate-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: regenerate and verify marketplaces
        run: |
          python -B generate.py
          python -B generate.py --check
      - name: mint the updater token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: publish generated files
        uses: tj-agents/github-actions/.github/actions/publish-generated@1a8099ab95aaf609704f892087081c35d15b331a
        with:
          token: ${{ steps.app-token.outputs.token }}
          source-sha: ${{ github.sha }}
          branch: ${{ github.event.repository.default_branch }}
          paths: |
            .claude-plugin/marketplace.json
            .agents/plugins/marketplace.json
