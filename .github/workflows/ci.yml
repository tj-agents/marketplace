name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-standards:
    name: python-standards
    uses: tj-agents/template/.github/workflows/python-standards.yml@a304090dbc92c8abd2eee3fcf10a8a878774f2c0

  verify:
    name: verify
    needs: python-standards
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Generated marketplaces and instruction pairs are current
        env:
          GH_TOKEN: ${{ secrets.TJ_AGENTS_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        run: python -B generate_marketplaces.py --check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Sync the locked Python tooling environment
        run: uv sync --locked
      - name: Instruction pair tests
        run: uv run --locked pytest -q
