name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - name: generated marketplaces and instruction pairs are current
        run: python -B generate.py --check
      - name: install test runner
        run: python -m pip install pytest==9.1.1
      - name: instruction pair tests
        run: python -B -m pytest -q -o strict=true -W error
