name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-standards:
    uses: tj-agents/template/.github/workflows/python-standards.yml@83ff855873610c02b445ba436fd40836bf01252b

  verify:
    needs: python-standards
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - name: generated marketplaces and instruction pairs are current
        run: python -B generate.py --check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: sync the locked Python tooling environment
        run: uv sync --locked
      - name: instruction pair tests
        run: uv run --locked pytest -q
