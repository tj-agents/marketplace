[project]
name = "tj-agents-marketplace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.1.1", "pytest-socket>=0.7.0", "ruff>=0.17.4"]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = [".agents/sync_generated.py", ".agents/dependencies", ".codex/skills", ".claude/skills", ".codex/hooks/snapshot.py", ".codex/hooks/bootstrap.py", ".worktrees", ".template"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[tool.mypy]
exclude = ["(^|/)(?:\\.agents/sync_generated\\.py|\\.agents/dependencies/|\\.codex/skills/|\\.claude/skills/|\\.codex/hooks/(?:snapshot|bootstrap)\\.py|\\.worktrees/|\\.template/)"]
explicit_package_bases = true
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "exhaustive-match"]
files = ["."]

[tool.pytest]
strict = true
testpaths = ["."]
addopts = ["--import-mode=importlib", "--disable-socket", "-ra"]
filterwarnings = ["error"]

[tool.ruff.lint.per-file-ignores]
"test_generate.py" = ["E501", "I001", "PT009", "TID251"]
"generate.py" = ["E501", "I001"]

[tool.ruff.format]
exclude = ["generate.py", "test_generate.py", "test_pins.py"]

[[tool.mypy.overrides]]
module = "test_generate"
disable_error_code = ["no-untyped-call", "no-untyped-def"]
